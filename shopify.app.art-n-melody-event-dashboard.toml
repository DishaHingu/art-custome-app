# Learn more about configuring your app at:
# https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "84ad78e10b01817331fb18f4a10b6927"

application_url = "https://art-custome-app-creh.vercel.app"

embedded = true

name = "Art N Melody Event Dashboard"

[webhooks]
api_version = "2026-10"

[access_scopes]
scopes = "read_orders,read_products,read_all_orders"

[auth]
redirect_urls = [
  "https://art-custome-app-creh.vercel.app/auth/callback"
]

[build]
automatically_update_urls_on_dev = true

[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

[[webhooks.subscriptions]]
uri = "/webhooks/app/scopes_update"
topics = ["app/scopes_update"]

[[webhooks.subscriptions]]
uri = "/webhooks/orders"
topics = ["orders/create", "orders/updated", "orders/cancelled", "orders/paid", "orders/delete", "refunds/create"]
